name: Build & Sign Android

# Installable APKs for GitHub Releases + Obtainium (early + stable).
# F-Droid is a later dual-channel step — not used for day-to-day device installs.
#
# Triggers:
#   - push main → refresh floating `preview` pre-release (Obtainium early channel)
#   - tag v* on main → versioned GitHub Releases (phone + TV)
#   - workflow_dispatch → same as main (optional version label)
on:
  push:
    branches: [main]
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Optional version label (default: preview-<sha> or tag)'
        required: false

permissions:
  contents: read
  actions: write

concurrency:
  group: android-release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    # Skip re-entry when softprops creates v*-phone / v*-tv tags.
    if: "!endsWith(github.ref_name, '-phone') && !endsWith(github.ref_name, '-tv')"
    defaults:
      run:
        working-directory: apps
    outputs:
      version: ${{ steps.version.outputs.version }}
      version_code: ${{ steps.version.outputs.version_code }}
      version_name: ${{ steps.version.outputs.version_name }}
      channel: ${{ steps.version.outputs.channel }}
      signed: ${{ steps.keystore.outputs.signed }}
      phone_apk: ${{ steps.stage.outputs.phone_apk }}
      tv_apk: ${{ steps.stage.outputs.tv_apk }}

    steps:
      - uses: actions/checkout@v7

      - name: Set up JDK 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Install Android SDK packages
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          : "${ANDROID_HOME:?ANDROID_HOME missing on runner}"
          mkdir -p "$ANDROID_HOME/licenses"
          printf '%s\n' \
            '24333f8a63b6825ea9c5514f83c2829b004d1fee' \
            > "$ANDROID_HOME/licenses/android-sdk-license"
          SDKMANAGER="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"
          if [ ! -x "$SDKMANAGER" ]; then
            SDKMANAGER="$ANDROID_HOME/cmdline-tools/16.0/bin/sdkmanager"
          fi
          "$SDKMANAGER" "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Resolve version + channel
        id: version
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          # versionCode is always the monotonically increasing Actions run number
          # so Obtainium / PackageManager always see a newer APK.
          VERSION_CODE="${{ github.run_number }}"

          if [ -n "${{ github.event.inputs.version }}" ]; then
            # Manual dispatch: optional SemVer-ish label; still preview channel.
            VERSION_NAME="${{ github.event.inputs.version }}"
            CHANNEL="preview"
          elif [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION_NAME="${GITHUB_REF#refs/tags/v}"
            # SemVer pre-release (contains '-') → GitHub pre-release (milestone)
            if [[ "$VERSION_NAME" == *-* ]]; then
              CHANNEL="prerelease"
            else
              CHANNEL="stable"
            fi
          else
            # Floating preview on main: 0.1.<run_number>
            # Avoid SemVer pre-release suffixes (0.1.0-dev.N): Obtainium's default
            # detector often strips after "-" and then never sees an update.
            VERSION_NAME="0.1.${VERSION_CODE}"
            CHANNEL="preview"
          fi

          echo "version=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "version_code=$VERSION_CODE" >> "$GITHUB_OUTPUT"
          echo "version_name=$VERSION_NAME" >> "$GITHUB_OUTPUT"
          echo "channel=$CHANNEL" >> "$GITHUB_OUTPUT"
          echo "Resolved versionName=$VERSION_NAME versionCode=$VERSION_CODE channel=$CHANNEL"

      - name: Decode keystore
        id: keystore
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "No ANDROID_KEYSTORE_BASE64 — APKs will use debug signing (fine for early Obtainium until project key exists)."
            echo "signed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > apps/keystore.jks
          SIZE=$(wc -c < apps/keystore.jks | tr -d ' ')
          if [ "$SIZE" -lt 100 ]; then
            echo "Decoded keystore too small ($SIZE bytes)"
            exit 1
          fi
          echo "signed=true" >> "$GITHUB_OUTPUT"

      - name: Write keystore.properties
        if: steps.keystore.outputs.signed == 'true'
        working-directory: ${{ github.workspace }}
        env:
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          if [ -z "${ANDROID_KEY_ALIAS:-}" ] || [ -z "${ANDROID_KEYSTORE_PASSWORD:-}" ]; then
            echo "Signing secrets incomplete"
            exit 1
          fi
          printf '%s\n' \
            'storeFile=keystore.jks' \
            "storePassword=$ANDROID_KEYSTORE_PASSWORD" \
            "keyAlias=$ANDROID_KEY_ALIAS" \
            "keyPassword=${ANDROID_KEY_PASSWORD:-$ANDROID_KEYSTORE_PASSWORD}" \
            > apps/keystore.properties

      - name: Assemble fossRelease (phone + TV)
        run: >
          ./gradlew :android:assembleFossRelease :android-tv:assembleFossRelease
          -PsoloVersionCode=${{ steps.version.outputs.version_code }}
          -PsoloVersionName=${{ steps.version.outputs.version_name }}
          --stacktrace

      - name: Stage versioned APKs
        working-directory: ${{ github.workspace }}
        run: |
          set -euo pipefail
          VERSION="${{ steps.version.outputs.version }}"
          CHANNEL="${{ steps.version.outputs.channel }}"
          mkdir -p artifacts
          PHONE=$(find apps/android/build/outputs/apk/foss/release -name '*.apk' | head -1)
          TV=$(find apps/android-tv/build/outputs/apk/foss/release -name '*.apk' | head -1)
          # Always embed versionName in the APK filename so Obtainium sees a new
          # asset (overwriting solo-preview-foss.apk on a floating release does not).
          PHONE_OUT="solo-${VERSION}-foss.apk"
          TV_OUT="solo-tv-${VERSION}-foss.apk"
          echo "phone_apk=$PHONE_OUT" >> "$GITHUB_OUTPUT"
          echo "tv_apk=$TV_OUT" >> "$GITHUB_OUTPUT"
          cp "$PHONE" "artifacts/$PHONE_OUT"
          cp "$TV" "artifacts/$TV_OUT"
          (
            cd artifacts
            sha256sum "$PHONE_OUT" "$TV_OUT" > sha256.txt
          )
          ls -la artifacts
        id: stage

      - name: Upload APK artifacts
        uses: actions/upload-artifact@v4
        with:
          name: solo-foss-apks
          path: artifacts/*
          if-no-files-found: error

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
      actions: read
    # GitHub Releases for Obtainium:
    #   - floating `preview` on main / dispatch
    #   - versioned tags only when the commit is already on main
    if: >
      always() && needs.build.result == 'success' &&
      (github.event_name == 'workflow_dispatch' ||
       github.ref == 'refs/heads/main' ||
       startsWith(github.ref, 'refs/tags/v'))

    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Require tagged commit on main
        if: startsWith(github.ref, 'refs/tags/v')
        run: |
          set -euo pipefail
          git fetch origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "::error::Tag ${GITHUB_REF_NAME} is not on main. Merge first, then tag origin/main."
            exit 1
          fi

      - name: Download APKs
        uses: actions/download-artifact@v4
        with:
          name: solo-foss-apks
          path: artifacts

      - name: Certificate fingerprint (optional)
        id: cert
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
        run: |
          set -euo pipefail
          if [ "${{ needs.build.outputs.signed }}" != "true" ] || [ -z "${ANDROID_KEYSTORE_BASE64:-}" ]; then
            echo "fingerprint=debug-or-unsigned" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > /tmp/keystore.jks
          FP=$(keytool -list -v \
            -keystore /tmp/keystore.jks \
            -storepass "$ANDROID_KEYSTORE_PASSWORD" \
            -alias "$ANDROID_KEY_ALIAS" \
            2>/dev/null | grep "SHA256:" | awk '{print $2}')
          rm -f /tmp/keystore.jks
          echo "fingerprint=$FP" >> "$GITHUB_OUTPUT"

      - name: Build release notes
        env:
          VERSION: ${{ needs.build.outputs.version_name }}
          VERSION_CODE: ${{ needs.build.outputs.version_code }}
          CHANNEL: ${{ needs.build.outputs.channel }}
          PHONE_APK: ${{ needs.build.outputs.phone_apk }}
          TV_APK: ${{ needs.build.outputs.tv_apk }}
          FINGERPRINT: ${{ steps.cert.outputs.fingerprint }}
        run: |
          set -euo pipefail
          {
            if [ "$CHANNEL" = "preview" ]; then
              echo "## SOLO preview (early Android)"
              echo
              echo "Rolling pre-release for device testing via **Obtainium**."
              echo "\`versionName=${VERSION}\` · \`versionCode=${VERSION_CODE}\`. Not an F-Droid build."
              echo
              echo "Each \`main\` build **deletes and recreates** the \`preview\` GitHub Release"
              echo "(new release id + \`publishedAt\`) and ships versioned APK filenames so"
              echo "Obtainium detects an update."
            elif [ "$CHANNEL" = "prerelease" ]; then
              echo "## SOLO ${VERSION} (pre-release)"
              echo
              echo "Milestone Android build for Obtainium (enable Include pre-releases)."
              echo "\`versionName=${VERSION}\` · \`versionCode=${VERSION_CODE}\`."
            else
              echo "## SOLO ${VERSION}"
              echo
              echo "Production GitHub Release APKs for phone + Android TV (\`foss\`)."
              echo "\`versionName=${VERSION}\` · \`versionCode=${VERSION_CODE}\`."
            fi
            echo
            echo "### APKs"
            echo "- \`${PHONE_APK}\` — phone (\`net.moonbaseone.solo\`)"
            echo "- \`${TV_APK}\` — Android TV (\`net.moonbaseone.solo.tv\`)"
            echo
            echo "### SHA-256"
            echo '```'
            cat artifacts/sha256.txt
            echo '```'
            echo
            echo "### Certificate fingerprint"
            echo '```'
            echo "$FINGERPRINT"
            echo '```'
            echo
            echo "### Obtainium"
            echo "1. Add \`https://github.com/${{ github.repository }}\`"
            echo "2. Enable **Include pre-releases** for the early \`preview\` channel"
            echo "3. APK filter — phone: \`^solo-[0-9].*-foss\\.apk\$\` · TV: \`^solo-tv-[0-9].*-foss\\.apk\$\`"
          } > release-notes.md

      # Obtainium keys off release identity / asset names. Replacing files on a
      # long-lived release leaves the same release id and often no "update".
      - name: Recreate floating preview release
        if: needs.build.outputs.channel == 'preview'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # Drop previous release + tag so the next publish gets a fresh id.
          gh release delete preview --yes --cleanup-tag 2>/dev/null || true
          # Tag may remain if there was no release yet.
          git push origin :refs/tags/preview 2>/dev/null || true

      - name: Publish floating preview release
        if: needs.build.outputs.channel == 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: preview
          name: SOLO Android preview ${{ needs.build.outputs.version_name }}
          prerelease: true
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: |
            artifacts/${{ needs.build.outputs.phone_apk }}
            artifacts/${{ needs.build.outputs.tv_apk }}
            artifacts/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish phone release
        if: needs.build.outputs.channel != 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-phone
          name: SOLO ${{ needs.build.outputs.version_name }} (phone)
          prerelease: ${{ needs.build.outputs.channel == 'prerelease' }}
          body_path: release-notes.md
          files: |
            artifacts/${{ needs.build.outputs.phone_apk }}
            artifacts/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish TV release
        if: needs.build.outputs.channel != 'preview'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}-tv
          name: SOLO ${{ needs.build.outputs.version_name }} (TV)
          prerelease: ${{ needs.build.outputs.channel == 'prerelease' }}
          body_path: release-notes.md
          files: |
            artifacts/${{ needs.build.outputs.tv_apk }}
            artifacts/sha256.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
